    <h2>My shopping cart </h2>

   <button onclick="addFood()">AddPizza</button>
   <p id="cart"></p>

   <script>
  function addFood() {

    localStorage.setItem("food", "Pizza");

    displayFood();
}


function displayFood() {

    let savedFood = localStorage.getItem("food");

    document.getElementById("cart").textContent = savedFood;
}


// Automatically display saved food when page loads
displayFood();
   </script>
